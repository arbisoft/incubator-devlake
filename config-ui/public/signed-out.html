<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signed out | DevLake</title>
    <style>
      :root {
        color: #292b3f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #f9f9fa;
        box-sizing: border-box;
        color: #292b3f;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
      }

      main {
        width: min(100%, 480px);
      }

      .brand {
        color: #292b3f;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0;
        margin-bottom: 32px;
        text-align: center;
      }

      .card {
        background: #fff;
        border: 1px solid #f0f0f0;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgb(0 0 0 / 15%);
        padding: 32px;
        text-align: center;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.4;
        margin: 0 0 12px;
      }

      p {
        color: #94959f;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 24px;
      }

      a {
        background: #1677ff;
        border-radius: 6px;
        color: #fff;
        display: inline-block;
        font-size: 14px;
        line-height: 22px;
        padding: 6px 16px;
        text-decoration: none;
      }

      a:hover {
        background: #4096ff;
      }

      a:focus-visible {
        outline: 3px solid rgb(22 119 255 / 35%);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="DevLake">DevLake</div>
      <section class="card" aria-labelledby="signed-out-title">
        <h1 id="signed-out-title">You have signed out</h1>
        <p>Your DevLake session has been cleared.</p>
        <a href="/">Sign in</a>
      </section>
    </main>
  </body>
</html>
