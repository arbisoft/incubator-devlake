events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      https;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name _;

        server_tokens off;

        client_max_body_size 20m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Stands in for the Config UI catch-all.
        location / {
            return 404;
        }

        # Redirect /grafana (no trailing slash) to /grafana/
        location = /grafana {
            return 301 /grafana/;
        }

        # Grafana authentication is handled by Grafana Generic OAuth.
        location /grafana/ {
            # No URI part, so the /grafana/ prefix is preserved -- required by
            # GF_SERVER_SERVE_FROM_SUB_PATH.
            set $grafana gv-staging-gate:3001;
            proxy_pass http://$grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Email "";

            # Grafana Live uses websockets.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
