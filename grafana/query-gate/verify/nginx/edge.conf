events {}

# TLS front for both hostnames: the prod name passes through to Envoy's own TLS.
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $ssl_preread_server_name $gv_upstream {
        devlake-grafana.arbisoft.com gv-prod-envoy:443;
        default 127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $gv_upstream;
    }
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    client_max_body_size 20m;

    server {
        listen 127.0.0.1:8443 ssl;
        server_name aperture.arbisoft.com;
        ssl_certificate /certs/leaf.crt;
        ssl_certificate_key /certs/leaf.key;
        add_header X-Gv-Local 1 always;

        location / {
            set $staging gv-staging-nginx:80;
            proxy_pass http://$staging;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 90s;
        }
    }
}
