static_resources:
  listeners:
    - name: gv
      address:
        socket_address: { address: 0.0.0.0, port_value: 443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /certs/leaf.crt }
                    private_key: { filename: /certs/leaf.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: gv
                use_remote_address: true
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: UNESCAPE_AND_REDIRECT
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: gv
                  virtual_hosts:
                    - name: grafana
                      domains: ["devlake-grafana.arbisoft.com"]
                      response_headers_to_add:
                        - header: { key: x-gv-local, value: "1" }
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: gate, timeout: 35s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: gate
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: gate
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: gv-prod-grafana, port_value: 3001 }
