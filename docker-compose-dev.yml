version: "3"
services:
  mysql:
    image: mysql:8
    volumes:
      - mysql-storage:/var/lib/mysql
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: lake
      MYSQL_USER: merico
      MYSQL_PASSWORD: merico
      TZ: UTC
    command: --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
      --skip-log-bin

  postgres:
    image: postgres:14.2
    volumes:
      - postgres-storage:/var/lib/postgresql
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: lake
      POSTGRES_USER: merico
      POSTGRES_PASSWORD: merico
      TZ: UTC

  postgres17:
    image: postgres:17.2
    volumes:
      - postgres17-storage:/var/lib/postgresql
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: lake
      POSTGRES_USER: merico
      POSTGRES_PASSWORD: merico
      TZ: UTC

  grafana:
    image: devlake.docker.scarf.sh/apache/devlake-dashboard:latest
    build:
      context: grafana/
    ports:
      - 3002:3000
    # host.docker.internal is a Docker Desktop-only DNS alias; this makes it
    # resolve on Linux hosts too, so the Prometheus datasource (url from
    # $PROMETHEUS_URL, see grafana/provisioning/datasources/prometheus.yml)
    # can reach the otel-collector stack running directly on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      GF_SERVER_ROOT_URL: "${GF_SERVER_ROOT_URL:-http://localhost:3002}"
      GF_USERS_DEFAULT_THEME: "light"
      # Dev-only. Production bakes this plugin into the image (see grafana/Dockerfile);
      # here it is installed at container start because the grafana-storage volume
      # mounted above shadows /var/lib/grafana/plugins, hiding the plugins baked into
      # the built image.
      # Keep the version in sync with grafana/Dockerfile so dev matches production.
      GF_INSTALL_PLUGINS: "volkovlabs-form-panel 6.3.5"
      GF_SMTP_ENABLED: "${GF_SMTP_ENABLED:-false}"
      GF_SMTP_HOST: "${GF_SMTP_HOST:-}"
      GF_SMTP_USER: "${GF_SMTP_USER:-}"
      # WARNING: Do NOT set GF_SMTP_PASSWORD in the shared .env file.
      # Docker Compose reads .env for variable interpolation in all service definitions;
      # any value placed there would also reach devlake/config-ui via their env_file.
      # Export it in your shell before starting Compose or inject it through deployment secrets.
      GF_SMTP_PASSWORD: "${GF_SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${GF_SMTP_FROM_ADDRESS:-}"
      GF_SMTP_FROM_NAME: "${GF_SMTP_FROM_NAME:-Grafana}"
      GF_SMTP_STARTTLS_POLICY: "${GF_SMTP_STARTTLS_POLICY:-}"
      GF_SMTP_SKIP_VERIFY: "${GF_SMTP_SKIP_VERIFY:-false}"
      # Grafana keeps its own users and session. It uses the same customer OIDC
      # registration as DevLake, with Grafana's own exact callback URL.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "${GRAFANA_OIDC_ENABLED:-false}"
      GF_AUTH_GENERIC_OAUTH_NAME: "${GRAFANA_OIDC_NAME:-Google}"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "${OIDC_GOOGLE_CLIENT_ID:-}"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${OIDC_GOOGLE_CLIENT_SECRET:-}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "${GRAFANA_OIDC_SCOPES:-openid profile email}"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "${GRAFANA_OIDC_AUTH_URL:-https://accounts.google.com/o/oauth2/v2/auth}"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "${GRAFANA_OIDC_TOKEN_URL:-https://oauth2.googleapis.com/token}"
      GF_AUTH_GENERIC_OAUTH_API_URL: "${GRAFANA_OIDC_API_URL:-https://openidconnect.googleapis.com/v1/userinfo}"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "${GRAFANA_OIDC_ALLOW_SIGN_UP:-false}"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "${GRAFANA_OIDC_AUTO_LOGIN:-false}"
      GF_AUTH_DISABLE_LOGIN_FORM: "${GRAFANA_DISABLE_LOGIN_FORM:-false}"
      # Match a pre-created Grafana account by its verified OIDC email. This is
      # deliberately opt-in: deployments must explicitly accept email-based
      # identity linking rather than accidentally enabling it through a default.
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "${GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP:-false}"
      MYSQL_URL: mysql:3306
      MYSQL_DATABASE: lake
      MYSQL_USER: merico
      MYSQL_PASSWORD: merico
      # Bind-mounts ./grafana/provisioning/datasources, so this must be set even
      # before a Grafana image rebuild — Grafana expands $PROMETHEUS_URL to empty
      # if the var is missing.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://host.docker.internal:9090}
      TZ: UTC
    restart: always
    depends_on:
      - mysql

  otel-auth-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1010:1010 /auth && touch /auth/.htpasswd && chmod 755 /auth && chmod 644 /auth/.htpasswd"]
    volumes:
      - otel-auth:/auth
    restart: "no"

  devlake:
    image: devlake.docker.scarf.sh/apache/devlake:latest
    build:
      context: backend
      args:
        HTTPS_PROXY: "${HTTPS_PROXY}"
        GOPROXY: "${GOPROXY}"
    ports:
      - 8080:8080
    restart: always
    volumes:
      - devlake-log:/app/logs
      - otel-auth:/var/lib/devlake/otel-auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    environment:
      LOGGING_DIR: /app/logs
      OTEL_AUTH_HTPASSWD_PATH: /var/lib/devlake/otel-auth/.htpasswd
      OTEL_PUBLIC_ENDPOINT: "${OTEL_PUBLIC_ENDPOINT:-https://otel-aperture.arbisoft.com}"
      OTEL_DEFAULT_PROTOCOL: "${OTEL_DEFAULT_PROTOCOL:-grpc}"
      OTEL_RESTART_HELPER_URL: "${OTEL_RESTART_HELPER_URL:-http://host.docker.internal:9199}"
      OTEL_RESTART_HELPER_TOKEN: "${OTEL_RESTART_HELPER_TOKEN:-devlake-local-otel-restart-token}"
      OTEL_RESTART_HELPER_TIMEOUT_SECONDS: "${OTEL_RESTART_HELPER_TIMEOUT_SECONDS:-45}"
      # The backend returns this public proxy URL after logout when native auth is disabled.
      AUTH_PROXY_LOGOUT_URL: "${AUTH_PROXY_LOGOUT_URL:-}"
      TZ: UTC
      # LOGOUT_URI: https://xxx.amazoncognito.com/logout?client_id=yyy&logout_uri=http%3A%2F%2Flocalhost%3A4180%2Foauth2%2Fsign_out
    depends_on:
      mysql:
        condition: service_started
      otel-auth-init:
        condition: service_completed_successfully

  config-ui:
    image: devlake.docker.scarf.sh/apache/devlake-config-ui:latest
    build:
      context: "config-ui"
    ports:
      - 4000:4000
    env_file:
      - ./.env
    environment:
      DEVLAKE_ENDPOINT: devlake:8080
      # Keep the Config UI's stable /grafana/ link while Grafana itself serves
      # at its own local root URL for the Generic OAuth callback.
      USE_EXTERNAL_GRAFANA: "${USE_EXTERNAL_GRAFANA:-true}"
      GRAFANA_ENDPOINT: "${GRAFANA_ENDPOINT:-http://localhost:3002}"
      GRAFANA_OIDC_LOGIN_URL: "${GRAFANA_OIDC_LOGIN_URL:-http://localhost:3002/login/generic_oauth}"
      TZ: UTC
      #ADMIN_USER: devlake
      #ADMIN_PASS: letsdivein
    depends_on:
      - devlake

  authproxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    ports:
      - 4180:4180
    env_file:
      - ./.env
    # environment:
      # Reuse the local Google test client without duplicating its credentials. 
      # Enter these values in .env
      # OAUTH2_PROXY_PROVIDER: google
      # OAUTH2_PROXY_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID}
      # OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET}
      # OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      # OAUTH2_PROXY_UPSTREAMS: http://config-ui:4000
      # OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      # OAUTH2_PROXY_EMAIL_DOMAINS: arbisoft.com
      # OAUTH2_PROXY_COOKIE_SECURE: "false"
      # OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # OAUTH2_PROXY_REVERSE_PROXY: "true"
      # OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # OAUTH2_PROXY_WHITELIST_DOMAINS: localhost:4180
      # # DevLake trusts these proxy-provided identity headers when native auth is disabled.
      # OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      # # Allow only the static post-logout page to bypass Google authentication.
      # OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/signed-out$"

volumes:
  mysql-storage:
  grafana-storage:
  postgres-storage:
  postgres17-storage:
  devlake-log:
  otel-auth:
    name: devlake-otel-auth
