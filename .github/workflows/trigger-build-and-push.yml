name: Trigger Build and Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  trigger-build-and-push:
    name: Trigger build-and-push-container-image workflow
    runs-on: ubuntu-latest
    steps:
      - name: Create Temporary Deployment Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: ${{ secrets.GH_TRIGGER_OWNER }}
          repositories: |
            ${{ secrets.GH_TRIGGER_REPO }}

      - name: Trigger Build and Push Workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          OWNER: ${{ secrets.GH_TRIGGER_OWNER }}
          REPO: ${{ secrets.GH_TRIGGER_REPO }}
          WORKFLOW_ID: ${{ secrets.GH_TRIGGER_WORKFLOW_ID }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
              await github.rest.actions.createWorkflowDispatch({
                owner: process.env.OWNER,
                repo: process.env.REPO,
                workflow_id: process.env.WORKFLOW_ID,
                ref: 'main',
                inputs: {
                  'devlake_ref': '${{ github.ref_name }}',
                  'devlake_sha': '${{ github.sha }}'
                }
              });
