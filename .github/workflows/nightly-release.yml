# Publishes the newest pending draft release each night and starts the prod build and deploy.
name: Nightly Release

on:
  schedule:
    # 22:11 PKT
    - cron: "11 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report which draft would be published"
        type: boolean
        default: true

concurrency:
  group: nightly-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_BRANCH: main-arbisoft

jobs:
  publish:
    name: Publish pending draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      actions: read
    outputs:
      published: ${{ steps.publish.outputs.published }}
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Select and verify draft
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag_re='^v[0-9]+(\.[0-9]+)*-arbisoft$'
          ver() { local t="${1#v}"; echo "${t%-arbisoft}"; }
          # true when version $1 sorts strictly after version $2
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }
          fail() { echo "::error::$1"; echo "**Not published:** $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null) || latest=""
          latest_ver=$(ver "${latest:-v0}")
          echo "Latest release: ${latest:-none}" >> "$GITHUB_STEP_SUMMARY"

          tag="" sha="" id="" best=""
          while IFS=$'\t' read -r d_id d_tag d_target; do
            [ -n "$d_id" ] || continue
            if ! [[ "$d_tag" =~ $tag_re ]]; then
              echo "- Ignored draft \`$d_tag\`: tag doesn't match \`v*-arbisoft\`" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            v=$(ver "$d_tag")
            if ! newer "$v" "$latest_ver"; then
              echo "- Ignored draft \`$d_tag\`: not newer than ${latest:-none}" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ -z "$best" ] || newer "$v" "$best"; then
              [ -z "$tag" ] || echo "- Ignored draft \`$tag\`: a newer draft is pending" >> "$GITHUB_STEP_SUMMARY"
              best="$v" tag="$d_tag" sha="$d_target" id="$d_id"
            else
              echo "- Ignored draft \`$d_tag\`: a newer draft is pending" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[] | select(.draft) | [.id, .tag_name, .target_commitish] | @tsv')

          if [ -z "$tag" ]; then
            echo "Nothing to ship." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Selected draft: \`$tag\` at \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "draft $tag targets '$sha', not a commit; edit the draft and pick the commit under Target → Recent commits"

          exists=$(gh api "repos/$REPO/git/matching-refs/tags/$tag" --jq "map(select(.ref == \"refs/tags/$tag\")) | length")
          [ "$exists" = "0" ] || fail "tag $tag already exists, so it was most likely deployed when the tag was pushed; publish the release by hand"

          status=$(gh api "repos/$REPO/compare/$sha...$RELEASE_BRANCH" --jq .status)
          case "$status" in ahead|identical) ;; *) fail "commit $sha is not on $RELEASE_BRANCH (compare status: $status)" ;; esac

          # this workflow's own runs on the commit are not part of the gate
          workflow_id=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          own_suites=$(gh api "repos/$REPO/actions/workflows/$workflow_id/runs?head_sha=$sha&per_page=100" --jq '.workflow_runs[].check_suite_id')
          own_suites="$own_suites $(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .check_suite_id)"
          total=0 bad=""
          while IFS=$'\t' read -r suite name state conclusion; do
            [ -n "$suite" ] || continue
            if [[ " $own_suites " == *" $suite "* ]]; then continue; fi
            total=$((total + 1))
            if [ "$state" != "completed" ]; then
              bad="$bad, $name ($state)"
            else
              case "$conclusion" in success|skipped|neutral) ;; *) bad="$bad, $name ($conclusion)" ;; esac
            fi
          done < <(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --paginate --jq '.check_runs[] | [.check_suite.id, .name, .status, (.conclusion // "")] | @tsv')

          [ "$total" -gt 0 ] || fail "commit $sha has no check runs"
          [ -z "$bad" ] || fail "checks on $sha are not all green: ${bad#, }"
          echo "All $total check runs on \`$sha\` passed." >> "$GITHUB_STEP_SUMMARY"

          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "id=$id"
          } >> "$GITHUB_OUTPUT"

      - name: Publish draft
        id: publish
        if: steps.select.outputs.tag != '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.select.outputs.id }}
          TAG: ${{ steps.select.outputs.tag }}
        run: |
          set -euo pipefail
          url=$(gh api -X PATCH "repos/$REPO/releases/$ID" -F draft=false --jq .html_url)
          echo "Published $TAG: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Report dry run
        if: steps.select.outputs.tag != '' && inputs.dry_run == true
        run: echo "Dry run, nothing published." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Start prod build and deploy
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/trigger-build-and-push.yml
    with:
      devlake_ref: ${{ needs.publish.outputs.tag }}
      devlake_sha: ${{ needs.publish.outputs.sha }}
    secrets: inherit
