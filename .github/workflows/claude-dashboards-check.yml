# grafana-dashboards-check.yml greps only the top-level dashboards and runs only for PRs to
# main and release-*. This checks the Claude dashboards, on every branch they are developed
# against: classic JSON, the MySQL datasource by name, and drill-down links that resolve.
name: check-claude-dashboards

on:
  pull_request:
    branches:
      - main
      - main-arbisoft
      - release-*
    paths:
      - grafana/dashboards/**
      - .github/scripts/check_claude_dashboards.py
      - .github/workflows/claude-dashboards-check.yml

jobs:
  check-claude-dashboards:
    name: check claude dashboards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Claude dashboards and their drill-down links
        run: python3 .github/scripts/check_claude_dashboards.py grafana/dashboards grafana/dashboards/Claude
