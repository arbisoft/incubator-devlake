name: Build and Push Container Image

on:
  workflow_dispatch:
    inputs:
      devlake_ref:
        description: "DevLake repository ref (branch or tag)"
        required: true
        default: "main-arbisoft"
        type: string
      devlake_sha:
        description: "DevLake commit SHA (optional, will resolve from ref if empty)"
        required: false
        type: string
      deploy:
        description: "Deploy after a successful build"
        type: boolean
        default: true
        required: false

concurrency:
  group: build-and-deploy-devlake
  cancel-in-progress: false

jobs:
  build-and-push-builder:
    name: Build and Push devlake builder
    runs-on: hks-prod-runners
    environment: hks-prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout devlake
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: arbisoft/incubator-devlake
          ref: ${{ inputs.devlake_ref }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - name: Build and push lake image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./backend
          push: true
          target: builder
          tags: ${{ vars.ECR_REGISTRY }}/devlake-ci-cache:amd64-builder
          platforms: linux/amd64
          cache-from: ${{ vars.ECR_REGISTRY }}/devlake-ci-cache:amd64-builder
          cache-to: type=registry,ref=${{ vars.ECR_REGISTRY }}/devlake-ci-cache:amd64-builder,mode=max,image-manifest=true,oci-mediatypes=true

  build-and-push-base:
    name: Build and Push devlake base
    runs-on: hks-prod-runners
    environment: hks-prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout devlake
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: arbisoft/incubator-devlake
          ref: ${{ inputs.devlake_ref }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - name: Build and push lake image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./backend
          push: true
          target: base
          tags: ${{ vars.ECR_REGISTRY }}/devlake-ci-cache:base
          platforms: linux/amd64
          cache-from: ${{ vars.ECR_REGISTRY }}/devlake-ci-cache:base
          cache-to: type=registry,ref=${{ vars.ECR_REGISTRY }}/devlake-ci-cache:base,mode=max,image-manifest=true,oci-mediatypes=true

  build-devlake:
    needs: build-and-push-builder
    name: Build and cache devlake
    runs-on: hks-prod-runners
    environment: hks-prod
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        platform: ["amd64"]
    steps:
      - name: Checkout devlake
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: arbisoft/incubator-devlake
          ref: ${{ inputs.devlake_ref }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Get short sha
        id: get_short_sha
        run: |
          if [ -z "${{ inputs.devlake_sha }}" ]; then
            echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          else
            echo "SHORT_SHA=$(echo ${{ inputs.devlake_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/devlake-build-cache-${{ matrix.platform }}
          key: buildx-devlake-build-cache-${{ github.run_id }}-${{ matrix.platform }}

      - name: Build and cache lake build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./backend
          push: false
          target: build
          tags: ${{ vars.ECR_REGISTRY }}/devlake-ci-cache:build-cache-${{ matrix.platform }}
          platforms: linux/${{ matrix.platform }}
          cache-from: ${{ vars.ECR_REGISTRY }}/devlake-ci-cache:amd64-builder
          cache-to: type=local,mode=min,dest=/tmp/devlake-build-cache-${{ matrix.platform }}
          build-args: |
            TAG=${{ inputs.devlake_ref }}
            SHA=${{ steps.get_short_sha.outputs.SHORT_SHA }}

  get-timestamp:
    name: Get build timestamp
    runs-on: hks-prod-runners
    outputs:
      timestamp: ${{ steps.ts.outputs.timestamp }}
    steps:
      - name: Get build timestamp
        id: ts
        run: echo "timestamp=$(date '+%y%m%d_%H%M')" >> $GITHUB_OUTPUT

  build-and-push-devlake:
    needs: [build-devlake, build-and-push-base, get-timestamp]
    name: Build and Push devlake image
    runs-on: hks-prod-runners
    environment: hks-prod
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.get_push_tags.outputs.TAG }}
    steps:
      - name: Checkout devlake
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: arbisoft/incubator-devlake
          ref: ${{ inputs.devlake_ref }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Get short sha
        id: get_short_sha
        run: |
          if [ -z "${{ inputs.devlake_sha }}" ]; then
            echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          else
            echo "SHORT_SHA=$(echo ${{ inputs.devlake_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/devlake-build-cache-amd64
          key: buildx-devlake-build-cache-${{ github.run_id }}-amd64

      - name: Get push tags
        id: get_push_tags
        run: |
          image_name=${{ vars.ECR_REGISTRY }}/devlake
          if printf "${{ inputs.devlake_ref }}" | grep -Pq '^v'; then
              tag="${{ inputs.devlake_ref }}"
          else
              tag="${{ inputs.devlake_ref }}_${{ needs.get-timestamp.outputs.timestamp }}_${{ steps.get_short_sha.outputs.SHORT_SHA }}"
          fi
          echo "TAG=${tag}" >> $GITHUB_OUTPUT
          echo "TAGS=${image_name}:${tag}" >> $GITHUB_OUTPUT

      - name: Build and push lake image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.get_push_tags.outputs.TAGS }}
          platforms: linux/amd64
          cache-from: |
            ${{ vars.ECR_REGISTRY }}/devlake-ci-cache:amd64-builder
            ${{ vars.ECR_REGISTRY }}/devlake-ci-cache:base
            type=local,src=/tmp/devlake-build-cache-amd64
          build-args: |
            TAG=${{ inputs.devlake_ref }}
            SHA=${{ steps.get_short_sha.outputs.SHORT_SHA }}

      - name: Clear cache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        if: always()
        with:
          script: |
            for (const arch of ['amd64']) {
              try {
                await github.rest.actions.deleteActionsCacheByKey({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  key: `buildx-devlake-build-cache-${context.runId}-${arch}`,
                })
                console.log(`Clear cache buildx-devlake-build-cache-${context.runId}-${arch}`)
              } catch (e) {
                console.warn(`Error clear cache buildx-devlake-build-cache-${context.runId}-${arch}: ${e}`)
              }
            }

  build-and-push-other-image:
    needs: [get-timestamp]
    name: Build and Push ${{ matrix.build.name }} image
    runs-on: hks-prod-runners
    environment: hks-prod
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        build:
          - name: config-ui
            image: devlake-config-ui
            context: config-ui
          - name: grafana
            image: devlake-dashboard
            context: grafana
    steps:
      - name: Checkout devlake
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: arbisoft/incubator-devlake
          ref: ${{ inputs.devlake_ref }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Get short sha
        id: get_short_sha
        run: |
          if [ -z "${{ inputs.devlake_sha }}" ]; then
            echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          else
            echo "SHORT_SHA=$(echo ${{ inputs.devlake_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - name: Get push tags
        id: get_push_tags
        run: |
          image_name=${{ vars.ECR_REGISTRY }}/${{ matrix.build.image }}
          if printf "${{ inputs.devlake_ref }}" | grep -Pq '^v'; then
              echo "TAGS=${image_name}:${{ inputs.devlake_ref }}" >> $GITHUB_OUTPUT
          else
              echo "TAGS=${image_name}:${{ inputs.devlake_ref }}_${{ needs.get-timestamp.outputs.timestamp }}_${{ steps.get_short_sha.outputs.SHORT_SHA }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.build.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.build.context }}
          push: true
          tags: ${{ steps.get_push_tags.outputs.TAGS }}
          platforms: linux/amd64

  deploy:
    needs: [build-and-push-devlake, build-and-push-other-image]
    if: ${{ inputs.deploy != false }}
    uses: ./.github/workflows/deploy-container-image.yml
    with:
      environment: hks-prod
      image_tag: ${{ needs.build-and-push-devlake.outputs.image_tag }}
    secrets: inherit