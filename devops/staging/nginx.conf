events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Every proxy_pass below targets a variable so the
    # name is resolved per request: names inside an `upstream` block are
    # resolved once at startup and cached for the process lifetime, which means
    # any container that gets a new bridge IP on redeploy would 502 until nginx
    # was manually reloaded.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # TLS terminates on the upstream nginx, so $scheme is always "http" here.
    # Trust the forwarded value and fall back to https, never to $scheme:
    # oauth2-proxy derives its OAuth redirect URI from this header, and an
    # http:// callback is rejected by Google for any host but localhost.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      https;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name _;

        # Hide nginx version
        server_tokens off;

        # Matches the config-ui image's own limit; DevLake API payloads exceed
        # the 1m default.
        client_max_body_size 20m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Internal oauth2-proxy auth check endpoint. Returns 202 when the
        # session cookie is valid, 401 otherwise, plus the X-Auth-Request-*
        # headers that --set-xauthrequest enables.
        location = /oauth2/auth {
            internal;
            set $oauth2_proxy oauth2-proxy:4180;
            proxy_pass              http://$oauth2_proxy;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
            proxy_set_header        Host $host;
            proxy_set_header        X-Forwarded-Proto $fwd_proto;
            proxy_set_header        X-Forwarded-Host $host;
        }

        # Browser navigation that failed the gate: start the OAuth dance and
        # come back to where the user was going.
        location @oauth2_signin {
            return 302 /oauth2/start?rd=$fwd_proto://$host$request_uri;
        }

        # XHR that failed the gate. Deliberately NOT a redirect: following one
        # would land the request on Google's cross-origin login page and fail
        # CORS, surfacing as an opaque network error instead of a 401.
        location @api_unauthorized {
            default_type application/json;
            return 401 '{"success":false,"message":"authentication required"}';
        }

        # Config UI, and oauth2-proxy's own /oauth2/* endpoints (start,
        # callback, sign_out), which fall through to here.
        location / {
            set $oauth2_proxy oauth2-proxy:4180;
            proxy_pass http://$oauth2_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
            # DevLake trusts these headers verbatim for its audit identity, so
            # never let a client supply them. oauth2-proxy sets the real values.
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Email "";
        }

        # API-key endpoints. These deliberately SKIP the oauth2-proxy gate,
        # because DevLake authenticates them itself and their callers have no
        # browser session: webhooks and CI automation present a Bearer API key.
        # RestAuthentication runs first in the middleware chain
        # (backend/server/api/api.go:111) and short-circuits every /rest path
        # through CheckAuthorizationHeader, which validates the key, its expiry
        # and its allowed-path regex. Gating this behind auth_request would
        # break incoming webhooks with no obvious symptom.
        #
        # Longer prefix than /api/, so this location wins.
        location /api/rest/ {
            rewrite ^/api/(.*)$ /$1 break;

            set $devlake_rest devlake:8080;
            proxy_pass http://$devlake_rest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            # The API key is the identity here; never let a client assert one.
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Email "";
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Everything else under the DevLake API. Proxied straight to the backend
        # rather than through oauth2-proxy, so the auth_request gate below is the
        # ONLY thing standing in front of it: DevLake's API-key middleware
        # guards /rest paths only, and AUTH_ENABLED defaults to false.
        location /api/ {
            auth_request /oauth2/auth;
            auth_request_set $auth_user  $upstream_http_x_auth_request_user;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;
            error_page 401 = @api_unauthorized;

            # proxy_pass with a variable does not strip the location prefix,
            # so the rewrite has to do it. Query args are re-appended by nginx.
            rewrite ^/api/(.*)$ /$1 break;

            set $devlake devlake:8080;
            proxy_pass http://$devlake;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            # Identity comes from the auth_request subrequest, never the client.
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Email $auth_email;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Redirect /grafana (no trailing slash) to /grafana/
        location = /grafana {
            return 301 /grafana/;
        }

        # Grafana. The gate is what keeps GF_SECURITY_ADMIN_* off the public
        # internet; Grafana's own login form still runs behind it.
        location /grafana/ {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_signin;

            # No URI part, so the /grafana/ prefix is preserved -- required by
            # GF_SERVER_SERVE_FROM_SUB_PATH.
            set $grafana grafana:3000;
            proxy_pass http://$grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Email "";

            # Grafana Live uses websockets.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
