# EXAMPLE — copy into the deploy workflows repo as e.g.
#   .github/workflows/deploy-devlake-staging.yml
# Then set incubator-devlake secrets:
#   GH_STAGING_DEPLOY_OWNER / GH_STAGING_DEPLOY_REPO / GH_STAGING_DEPLOY_WORKFLOW_ID
#
# Triggered by incubator-devlake's build-and-push-staging-ghcr.yml with:
#   image_tag, registry

name: Deploy DevLake Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag produced by the GHCR build workflow"
        required: true
        type: string
      registry:
        description: "GHCR registry prefix (owner-qualified)"
        required: false
        default: "ghcr.io/arbisoft"
        type: string

concurrency:
  group: deploy-devlake-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and up on staging
    # Replace with the label(s) registered by the self-hosted runner on the
    # staging VM. The job must run on that host (not SSH from ubuntu-latest).
    runs-on: [self-hosted, staging, devlake]
    permissions:
      contents: read
      packages: read
    env:
      STAGING_DIR: /opt/devlake/incubator-devlake/devops/staging
      IMAGE_TAG: ${{ inputs.image_tag }}
      REGISTRY: ${{ inputs.registry }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Prefer a PAT / App token with read:packages stored as a secret if
          # GITHUB_TOKEN from this repo cannot pull packages owned by the
          # incubator-devlake org/user.
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update image refs in .env
        run: |
          set -euo pipefail
          cd "${STAGING_DIR}"
          test -f .env
          python3 - <<'PY'
          import os, pathlib, re
          env_path = pathlib.Path(".env")
          text = env_path.read_text()
          registry = os.environ["REGISTRY"].rstrip("/")
          tag = os.environ["IMAGE_TAG"]
          updates = {
              "DEVLAKE_IMAGE": f"{registry}/devlake:{tag}",
              "CONFIG_UI_IMAGE": f"{registry}/devlake-config-ui:{tag}",
              "GRAFANA_IMAGE": f"{registry}/devlake-dashboard:{tag}",
          }
          for key, value in updates.items():
              pattern = re.compile(rf"^{re.escape(key)}=.*$", re.M)
              line = f"{key}={value}"
              if pattern.search(text):
                  text = pattern.sub(line, text)
              else:
                  text = text.rstrip() + "\n" + line + "\n"
          env_path.write_text(text)
          print("Updated:", ", ".join(updates))
          PY

      - name: Pull images
        working-directory: ${{ env.STAGING_DIR }}
        run: docker compose -f docker-compose-staging.yml pull

      - name: Up
        working-directory: ${{ env.STAGING_DIR }}
        run: docker compose -f docker-compose-staging.yml up -d

      - name: Health check
        working-directory: ${{ env.STAGING_DIR }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker compose -f docker-compose-staging.yml exec -T devlake \
              curl -fsS http://localhost:8080/ping >/dev/null; then
              echo "devlake /ping ok"
              exit 0
            fi
            sleep 10
          done
          echo "devlake did not become healthy in time" >&2
          docker compose -f docker-compose-staging.yml ps
          exit 1
