receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: basicauth/server
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: basicauth/server

processors:
  attributes/team:
    actions:
      # Stamp the verified credential's team slug instead of trusting client input.
      - key: devlake_team
        action: delete
      # Project placement is DevLake configuration metadata, never client-provided metric attribution.
      - key: devlake_project
        action: delete
      - key: devlake_auth_username
        from_context: auth.username
        action: upsert
      - key: devlake_auth_username
        pattern: "^otel_(?P<devlake_team>[a-z0-9]+(?:-[a-z0-9]+)*)_[a-z0-9]+$"
        action: extract
      - key: devlake_auth_username
        action: delete
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  delta_to_cumulative: {}

  batch/prometheus:
    send_batch_size: 16384
    timeout: 500ms
    send_batch_max_size: 32768

exporters:
  otlphttp/claude_raw:
    endpoint: ${env:CLAUDE_OTEL_INGEST_ENDPOINT}
    headers:
      X-Claude-Otel-Ingest-Token: ${env:CLAUDE_OTEL_INGEST_TOKEN}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      multiplier: 1.5
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      storage: file_storage/claude_raw
      num_consumers: 1
      sizer: bytes
      queue_size: 536870912
      block_on_overflow: true
      batch:
        sizer: bytes
        min_size: 262144
        max_size: 1048576
        flush_timeout: 10s
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_constant_labels:
      included: ["*"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/server:
    htpasswd:
      file: /etc/otelcol-contrib/auth/.htpasswd
  file_storage/claude_raw:
    directory: /var/lib/otel/queue
    create_directory: true
    fsync: true
    max_size: 1073741824
    compaction:
      on_rebound: true
      rebound_needed_threshold_mib: 128
      rebound_trigger_threshold_mib: 32
      check_interval: 30s

connectors:
  forward/claude_raw: {}
  forward/prometheus: {}

service:
  extensions: [health_check, basicauth/server, file_storage/claude_raw]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/team]
      exporters: [forward/claude_raw, forward/prometheus]
    metrics/claude_raw:
      receivers: [forward/claude_raw]
      exporters: [otlphttp/claude_raw]
    metrics/prometheus:
      receivers: [forward/prometheus]
      processors: [delta_to_cumulative, batch/prometheus]
      exporters: [prometheus]
