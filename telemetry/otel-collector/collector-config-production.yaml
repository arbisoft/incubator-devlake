receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: basicauth/server
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: basicauth/server

processors:
  attributes/team:
    actions:
      # Stamp the verified credential's team slug instead of trusting client input.
      - key: devlake_team
        action: delete
      # Project placement is DevLake configuration metadata, never client-provided metric attribution.
      - key: devlake_project
        action: delete
      - key: devlake_auth_username
        from_context: auth.username
        action: upsert
      - key: devlake_auth_username
        pattern: "^otel_(?P<devlake_team>[a-z0-9]+(?:-[a-z0-9]+)*)_[a-z0-9]+$"
        action: extract
      - key: devlake_auth_username
        action: delete
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  delta_to_cumulative: {}

  batch:
    send_batch_size: 16384
    timeout: 500ms
    send_batch_max_size: 32768

exporters:
  file/metrics:
    path: /var/lib/otel/claude-metrics.json
    format: json
    rotation:
      max_megabytes: 32
      max_days: 7
      max_backups: 14
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_constant_labels:
      included: ["*"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/server:
    htpasswd:
      file: /etc/otelcol-contrib/auth/.htpasswd

service:
  extensions: [health_check, basicauth/server]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/team, delta_to_cumulative, batch]
      exporters: [file/metrics, prometheus]
