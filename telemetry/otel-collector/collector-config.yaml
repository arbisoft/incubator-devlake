receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: basicauth/server
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: basicauth/server

processors:
  resource/attribution:
    attributes:
      # The attributes processor below edits datapoints only. Remove spoofable resource-level
      # attribution so it cannot reach Prometheus labels or DevLake raw storage.
      - key: devlake_team
        action: delete
      - key: devlake_project
        action: delete
  attributes/team:
    actions:
      # Stamp the verified credential's team slug instead of trusting client input.
      - key: devlake_team
        action: delete
      # Project placement is DevLake configuration metadata, never client-provided metric attribution.
      - key: devlake_project
        action: delete
      - key: devlake_auth_username
        from_context: auth.username
        action: upsert
      - key: devlake_auth_username
        pattern: "^otel_(?P<devlake_team>[a-z0-9]+(?:-[a-z0-9]+)*)_[a-z0-9]+$"
        action: extract
      - key: devlake_auth_username
        action: delete
  # Claude Code events reach DevLake without response, tool or error content, even when a
  # developer enables OTEL_LOG_TOOL_DETAILS. DevLake strips them too. Prompt text passes
  # through for developers who opted in with OTEL_LOG_USER_PROMPTS=1.
  attributes/drop_content:
    actions:
      - key: response
        action: delete
      - key: body
        action: delete
      - key: tool_input
        action: delete
      - key: tool_parameters
        action: delete
      - key: error
        action: delete
  # DevLake stores session.id; Prometheus drops it so per-session series never become labels.
  attributes/drop_session:
    actions:
      - key: session.id
        action: delete
  resource/drop_session:
    attributes:
      - key: session.id
        action: delete
  delta_to_cumulative: {}
  batch/prometheus:
    send_batch_size: 1024
    timeout: 5s

exporters:
  debug:
    verbosity: detailed
  otlphttp/claude_raw:
    endpoint: ${env:CLAUDE_OTEL_INGEST_ENDPOINT}
    compression: none
    headers:
      X-Claude-Otel-Ingest-Token: ${env:CLAUDE_OTEL_INGEST_TOKEN}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      multiplier: 1.5
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      storage: file_storage/claude_raw
      num_consumers: 1
      sizer: bytes
      queue_size: 536870912
      # Reject on saturation rather than block the exporter in the known persistent-queue deadlock path.
      # Monitor enqueue failures and backlog before the bounded queue fills.
      block_on_overflow: false
      batch:
        sizer: bytes
        min_size: 262144
        max_size: 1048576
        flush_timeout: 10s
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_constant_labels:
      included: ["*"]
    const_labels:
      service: claude-adoption

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/server:
    htpasswd:
      file: /etc/otelcol-contrib/auth/.htpasswd
  file_storage/claude_raw:
    directory: /var/lib/otel/queue
    create_directory: true
    fsync: true
    max_size: 1073741824
    compaction:
      # Keep compaction scratch space on the writable queue volume; the default is not writable.
      directory: /var/lib/otel/compaction
      on_rebound: true
      rebound_needed_threshold_mib: 128
      rebound_trigger_threshold_mib: 32
      check_interval: 30s

connectors:
  forward/claude_raw: {}
  forward/prometheus: {}

service:
  telemetry:
    metrics:
      # Internal Collector metrics expose raw queue size, capacity, and enqueue failures.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check, basicauth/server, file_storage/claude_raw]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource/attribution, attributes/team]
      exporters: [forward/claude_raw, forward/prometheus]
    logs:
      receivers: [otlp]
      processors: [resource/attribution, attributes/team, attributes/drop_content]
      exporters: [otlphttp/claude_raw]
    metrics/claude_raw:
      receivers: [forward/claude_raw]
      exporters: [otlphttp/claude_raw]
    metrics/prometheus:
      receivers: [forward/prometheus]
      processors: [resource/drop_session, attributes/drop_session, delta_to_cumulative, batch/prometheus]
      exporters: [debug, prometheus]
