receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: basicauth/server
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: basicauth/server

processors:
  attributes/team:
    actions:
      # Stamp the verified credential's team slug instead of trusting client input.
      - key: devlake_team
        action: delete
      # Project placement is DevLake configuration metadata, never client-provided metric attribution.
      - key: devlake_project
        action: delete
      - key: devlake_auth_username
        from_context: auth.username
        action: upsert
      - key: devlake_auth_username
        pattern: "^otel_(?P<devlake_team>[a-z0-9]+(?:-[a-z0-9]+)*)_[a-z0-9]+$"
        action: extract
      - key: devlake_auth_username
        action: delete
  deltatocumulative: {}
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  debug:
    verbosity: detailed
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion:
      enabled: true
    const_labels:
      service: claude-adoption

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/server:
    htpasswd:
      file: /etc/otelcol-contrib/auth/.htpasswd

service:
  extensions: [health_check, basicauth/server]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [attributes/team, deltatocumulative, batch]
      exporters: [debug, prometheus]
