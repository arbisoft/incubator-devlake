receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: basicauth/server
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: basicauth/server

processors:
  resource/attribution:
    attributes:
      # The attributes processor below edits datapoints and log records only. Remove spoofable resource-level
      # attribution so it cannot reach Prometheus labels or DevLake raw storage.
      - key: devlake_team
        action: delete
      - key: devlake_project
        action: delete
  attributes/team:
    actions:
      # Stamp the verified credential's team slug instead of trusting client input.
      - key: devlake_team
        action: delete
      # Project placement is DevLake configuration metadata, never client-provided metric attribution.
      - key: devlake_project
        action: delete
      - key: devlake_auth_username
        from_context: auth.username
        action: upsert
      - key: devlake_auth_username
        pattern: "^otel_(?P<devlake_team>[a-z0-9]+(?:-[a-z0-9]+)*)_[a-z0-9]+$"
        action: extract
      - key: devlake_auth_username
        action: delete
  transform/strip_content:
    error_mode: ignore
    log_statements:
      # Response, tool input and raw API body content is never forwarded. DevLake strips the
      # same attributes again at ingest. Prompt text is forwarded and kept out of ai_* tables.
      # DevLake also keeps only skill and MCP names from tool_parameters at ingest.
      - delete_matching_keys(log.attributes, "^(response|tool_input|body|body_ref)$")
      - delete_matching_keys(resource.attributes, "^(response|tool_input|body|body_ref)$")
      # A tool_result error message can echo file contents; api_error messages are kept.
      # Claude Code may send the name with or without the claude_code. prefix.
      - delete_key(log.attributes, "error") where log.attributes["event.name"] == "tool_result" or log.attributes["event.name"] == "claude_code.tool_result"
  attributes/drop_session:
    actions:
      # Session ids are needed on events, but would make every session a Prometheus series.
      - key: session.id
        action: delete
      - key: ccr.session.id
        action: delete
  transform/drop_repository:
    error_mode: ignore
    metric_statements:
      # Repository identity is needed on events, but would add a series per repository to every
      # Prometheus metric. Claude Code sends it under OTEL_METRICS_INCLUDE_REPOSITORY.
      - delete_matching_keys(datapoint.attributes, "^vcs[.]")
      - delete_matching_keys(resource.attributes, "^vcs[.]")
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  delta_to_cumulative: {}
  batch/prometheus:
    send_batch_size: 1024
    timeout: 5s

exporters:
  debug:
    verbosity: detailed
  otlphttp/claude_raw:
    endpoint: ${env:CLAUDE_OTEL_INGEST_ENDPOINT}
    compression: none
    headers:
      X-Claude-Otel-Ingest-Token: ${env:CLAUDE_OTEL_INGEST_TOKEN}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      multiplier: 1.5
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      storage: file_storage/claude_raw
      num_consumers: 1
      sizer: bytes
      queue_size: 536870912
      # Reject on saturation rather than block the exporter in the known persistent-queue deadlock path.
      # Monitor enqueue failures and backlog before the bounded queue fills.
      block_on_overflow: false
      batch:
        sizer: bytes
        min_size: 262144
        max_size: 1048576
        flush_timeout: 10s
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_constant_labels:
      included: ["*"]
    const_labels:
      service: claude-adoption

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/server:
    htpasswd:
      file: /etc/otelcol-contrib/auth/.htpasswd
  file_storage/claude_raw:
    directory: /var/lib/otel/queue
    create_directory: true
    fsync: true
    max_size: 1073741824
    compaction:
      # Keep compaction scratch space on the writable queue volume; the default is not writable.
      directory: /var/lib/otel/compaction
      on_rebound: true
      rebound_needed_threshold_mib: 128
      rebound_trigger_threshold_mib: 32
      check_interval: 30s

connectors:
  forward/claude_raw: {}
  forward/prometheus: {}

service:
  telemetry:
    metrics:
      # Internal Collector metrics expose raw queue size, capacity, and enqueue failures.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check, basicauth/server, file_storage/claude_raw]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/attribution, attributes/team]
      exporters: [forward/claude_raw, forward/prometheus]
    metrics/claude_raw:
      receivers: [forward/claude_raw]
      exporters: [otlphttp/claude_raw]
    # Claude Code events go only to DevLake, at /plugins/claude_otel/otlp/v1/logs.
    # The otlphttp/claude_raw sending_queue batches them (256 KiB to 1 MiB, 10s flush), so no
    # batch processor is needed.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/attribution, attributes/team, transform/strip_content]
      exporters: [otlphttp/claude_raw]
    metrics/prometheus:
      receivers: [forward/prometheus]
      processors: [attributes/drop_session, transform/drop_repository, delta_to_cumulative, batch/prometheus]
      exporters: [debug, prometheus]
