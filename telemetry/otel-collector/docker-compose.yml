services:
  otel-auth-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1010:1010 /auth && touch /auth/.htpasswd && chmod 755 /auth && chmod 644 /auth/.htpasswd"]
    volumes:
      - otel-auth:/auth
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - otel-auth:/etc/otelcol-contrib/auth:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      otel-auth-init:
        condition: service_completed_successfully
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  otel-restart-helper:
    build:
      context: ./restart-helper
    container_name: otel-restart-helper
    environment:
      OTEL_RESTART_HELPER_TOKEN: "${OTEL_RESTART_HELPER_TOKEN:-devlake-local-otel-restart-token}"
      OTEL_RESTART_CONTAINER: "${OTEL_RESTART_CONTAINER:-otel-collector}"
      OTEL_COLLECTOR_HEALTH_URL: "${OTEL_COLLECTOR_HEALTH_URL:-http://otel-collector:13133/healthz}"
      OTEL_RESTART_TIMEOUT_SECONDS: "${OTEL_RESTART_TIMEOUT_SECONDS:-45}"
      OTEL_RESTART_COOLDOWN_SECONDS: "${OTEL_RESTART_COOLDOWN_SECONDS:-30}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:9199:9199"
    depends_on:
      - otel-collector

volumes:
  otel-auth:
    name: devlake-otel-auth
  prometheus-data:
